# Esc interrupts Claude Code; the default 500ms escape delay makes that laggy
set -sg escape-time 10
# Scroll with the wheel, click to pick a pane, drag pane borders
set -g mouse on
set -g history-limit 50000
# Number windows from 1 so C-b 1 is the leftmost window
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload this file with C-b r
bind r source-file ~/.tmux.conf \; display 'reloaded'
# Terminal's window title shows "session · window"
set -g set-titles on
set -g set-titles-string '#S · #W'
# Look: swap file names to change it
# source-file ~/.config/tmux/minimal.conf
# source-file ~/.config/tmux/pills.conf
# source-file ~/.config/tmux/panes.conf
source-file ~/.config/tmux/monolith.conf

# Cheatsheet in a popup with C-b h; q closes it
bind h display-popup -E -w 90% -h 90% "less -S ~/.config/tmux/cheatsheet.txt"

# Session picker (sesh) with C-b T; Esc cancels without switching
bind T run-shell 's=$(sesh list -i | fzf-tmux -p 70%,60% --ansi --no-sort --border-label " sesh " --prompt "> ") && sesh connect "$s"; true'
# lazygit and Claude in popups, opened in the current pane's directory
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' lazygit
bind a display-popup -E -w 80% -h 75% -d '#{pane_current_path}' claude
# Toggle the status bar for this session
bind b if -F '#{==:#{status},off}' 'set status on' 'set status off'

# Plugins (TPM): sessions survive restarts. Skipped quietly until TPM is cloned.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
