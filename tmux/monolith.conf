# Monolith: layout only. Every colour comes from the wallsync render sourced at the end.
# Never set cursor-colour here: it makes tmux emit OSC 112, which breaks Ghostty reloads.

# Ghostty: truecolour, and passthrough for inline images (nvim math)
set -g default-terminal tmux-256color
# Fixed index: re-sourcing replaces the entry instead of appending another
set -s 'terminal-features[9]' 'xterm-ghostty:RGB'
set -g allow-passthrough on
# snacks.image only reads #{client_termname} (and so finds Ghostty) when this is on
set -s extended-keys on
# Forward focus changes so nvim's FocusGained checktime reloads notes changed on disk
set -g focus-events on
# A newly attached (or restarted) Ghostty holds no inline images: nvim's USR1 handler re-sends them.
# Fixed index so re-sourcing replaces the hook instead of appending.
set-hook -g 'client-attached[42]' "run-shell -b 'pkill -USR1 -x nvim; true'"
# continuum saves from status-right, which never runs for the status-off panel sessions; save on detach too
set-hook -g 'client-detached[43]' "run-shell -b '~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh'"

# Fallback label colours until the render exists (it overrides these)
set -g @mono_fg default
set -g @mono_dim brightblack

# Status: minimal bar at the top for multi-window sessions; the panel
# sessions from study/build switch it off per session
set -g status-position top
set -g status-justify left
set -g status-left ' #S  '
set -g status-left-length 20
set -g status-right '%a %H:%M '
set -g window-status-separator ''
setw -g window-status-format ' #I #W#{?window_bell_flag, !,} '
setw -g window-status-current-format ' #I #W '

# Panes: thin single lines with a label sitting on each top border.
# Label: nvim's own title ("nvim · file"), "claude · <session>", "cava",
# "vault" / "vault · due" in the vault session, else "command · dir".
set -g pane-border-status top
set -g pane-border-lines single
set -g pane-border-format ' #[fg=#{?pane_active,#{@mono_fg},#{@mono_dim}}]#{?#{==:#{pane_current_command},nvim},#{?#{==:#{pane_title},#{host}},nvim,#{pane_title}},#{?#{m:claude*,#{pane_current_command}},claude · #{session_name},#{?#{==:#{pane_current_command},cava},cava,#{?#{==:#{session_name},vault},#{?#{==:#{pane_index},1},vault,vault · due},#{pane_current_command} · #{b:pane_current_path}}}}}#[default] '
set -g popup-border-lines rounded

source-file -q ~/.cache/wallsync/out/tmux.conf
