# Minimal: flat bar at the bottom, current window inverted, bells in red
set -g status-position bottom
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=blue,bold]#S  '
set -g status-left-length 20
set -g status-right '#[fg=brightblack]%H:%M '
set -g window-status-separator ''
setw -g window-status-format ' #I #W#{?window_bell_flag, !,} '
setw -g window-status-current-format '#[fg=blue,bold,reverse] #I #W '
setw -g window-status-bell-style 'fg=red,bold'
set -g message-style 'bg=default,fg=yellow'
