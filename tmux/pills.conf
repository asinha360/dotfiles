# Pills: bar at the top, solid blocks for the session and current window.
# Square ends on purpose: Terminal.app draws glyphs lighter than cell backgrounds,
# so rounded Nerd Font caps never match the block colour there.
set -g status-position top
set -g status-style 'bg=default,fg=white'
set -g status-left '#[fg=magenta,reverse,bold] #S #[default] '
set -g status-left-length 20
set -g status-right '#[fg=brightblack]%a %H:%M '
set -g window-status-separator ''
setw -g window-status-format ' #I #W#{?window_bell_flag, !,} '
setw -g window-status-current-format '#[fg=blue,reverse,bold] #I #W '
setw -g window-status-bell-style 'fg=red,bold'
set -g message-style 'bg=default,fg=yellow'
