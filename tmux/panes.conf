# Panes: label each pane on its border, highlight the focused one, dim the rest
set -g pane-border-status top
set -g pane-border-lines heavy
set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=green'
set -g pane-border-format ' #{?#{m:claude*,#{pane_current_command}},#{pane_title},#{pane_current_command} · #{b:pane_current_path}} '
set -g window-style 'fg=brightblack'
set -g window-active-style 'fg=default'
