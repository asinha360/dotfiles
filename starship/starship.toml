# Monolith prompt: one line, ANSI colours only so it follows the wallpaper palette
#   ~/projects/dotfiles main 3s ❯
add_newline = false
format = "${custom.parent}$directory$git_branch$cmd_duration$character"

# Parent path in bright black; the directory module adds the current folder in white
[custom.parent]
command = 'p=$PWD; case $p in "$HOME"|"$HOME"/*) p="~${p#"$HOME"}" ;; esac; q=${p%/*}; if [ -n "$q" ] && [ "$p" != "~" ]; then printf "%s/" "$q"; fi'
when = true
shell = ["sh"]
style = "bright-black"
format = "[$output]($style)"

[directory]
truncation_length = 1
truncate_to_repo = false
truncation_symbol = ""
style = "white"
read_only = " ro"
read_only_style = "bright-black"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = ""
style = "bright-black"
format = "[$symbol$branch]($style) "

[cmd_duration]
min_time = 2000
style = "bright-black"
format = "[$duration]($style) "

[character]
success_symbol = "[❯](white)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](white)"
