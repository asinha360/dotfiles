# Monolith tiling. Option-W is reserved for the wallsync global hotkey, so nothing here binds it.
config-version = 2
start-at-login = true

persistent-workspaces = ['1', '2', '3', '4', '5']
default-root-container-layout = 'tiles'

# Keep the bar's workspace numbers current: the focused workspace on every
# switch, which workspaces hold windows on every focus change
exec-on-workspace-change = ['/bin/bash', '-c',
  '/opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change FOCUSED=$AEROSPACE_FOCUSED_WORKSPACE']
on-focus-changed = ['exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']
# The pointer follows focus to another screen (AeroSpace's default), and the bar
# updates even when that screen's workspace is empty
on-focused-monitor-changed = ['move-mouse monitor-lazy-center',
  'exec-and-forget /opt/homebrew/bin/sketchybar --trigger aerospace_workspace_change']

# With a second screen, the terminal workspaces (study, build, Projects) live on
# it and 4-5 stay on the laptop. Alone, the laptop matches no 'secondary' and
# holds all five. A newly connected screen shows one of its own workspaces.
[workspace-to-monitor-force-assignment]
1 = 'secondary'
2 = 'secondary'
3 = 'secondary'
4 = 'main'
5 = 'main'

# Top gap leaves room for the SketchyBar pills
[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.top = [{ monitor."built-in" = 12 }, 44]  # built-in: macOS already reserves ~32pt under the notch
outer.left = 10
outer.right = 10
outer.bottom = 10

[mode.main.binding]
# Directions continue across screens at a screen's edge
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

alt-shift-h = 'move --boundaries all-monitors-outer-frame left'
alt-shift-j = 'move --boundaries all-monitors-outer-frame down'
alt-shift-k = 'move --boundaries all-monitors-outer-frame up'
alt-shift-l = 'move --boundaries all-monitors-outer-frame right'

# The other screen; with shift, take the window along
alt-tab = 'focus-monitor --wrap-around next'
alt-shift-tab = 'move-node-to-monitor --focus-follows-window --wrap-around next'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'

alt-f = 'fullscreen'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-r = 'mode resize'

# Panel layouts: study on workspace 1, build on workspace 2
alt-s = 'exec-and-forget ~/.local/bin/study'
alt-b = 'exec-and-forget ~/.local/bin/build'

alt-shift-semicolon = 'mode service'

[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
enter = 'mode main'
esc = 'mode main'

[mode.service.binding]
r = ['reload-config', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']
esc = 'mode main'

# The wallsync picker and transition windows must never be tiled
[[on-window-detected]]
if.app-name-regex-substring = '^wallsync$'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'
